<style>
/* ================= Material 3 Tokens ================= */
:root{
  --m3-xs:4px; --m3-sm:8px; --m3-md:12px; --m3-lg:16px; --m3-xl:28px; --m3-full:9999px;
  --m3-ease: cubic-bezier(0.2, 0, 0, 1);
  --m3-ease-emph: cubic-bezier(0.05, 0.7, 0.1, 1);
  --m3-dur-short: 150ms;
  --m3-dur-med: 250ms;
  --m3-dur-long: 400ms;
}
html[data-theme="dark"]{
  --primary:#D0BCFF; --on-primary:#381E72;
  --primary-container:#4F378B; --on-primary-container:#EADDFF;
  --secondary-container:#4A4458; --on-secondary-container:#E8DEF8;
  --tertiary:#EFB8C8; --tertiary-container:#633B48; --on-tertiary-container:#FFD8E4;
  --error:#F2B8B5; --on-error:#601410;
  --error-container:#8C1D18; --on-error-container:#F9DEDC;
  --background:#141218; --on-background:#E6E0E9;
  --surface:#141218; --on-surface:#E6E0E9;
  --surface-variant:#49454F; --on-surface-variant:#CAC4D0;
  --surface-container-lowest:#0F0D13;
  --surface-container-low:#1D1B20;
  --surface-container:#211F26;
  --surface-container-high:#2B2930;
  --surface-container-highest:#36343B;
  --outline:#938F99; --outline-variant:#49454F;
  --inverse-surface:#E6E0E9; --inverse-on-surface:#322F35;
  --scrim:#000000;
  --success:#7DD8A6;
  --accent:#D0BCFF; --gold:#EFB8C8;
}
html[data-theme="light"]{
  --primary:#6750A4; --on-primary:#FFFFFF;
  --primary-container:#EADDFF; --on-primary-container:#21005D;
  --secondary-container:#E8DEF8; --on-secondary-container:#1D192B;
  --tertiary:#7D5260; --tertiary-container:#FFD8E4; --on-tertiary-container:#31111D;
  --error:#B3261E; --on-error:#FFFFFF;
  --error-container:#F9DEDC; --on-error-container:#410E0B;
  --background:#FEF7FF; --on-background:#1D1B20;
  --surface:#FEF7FF; --on-surface:#1D1B20;
  --surface-variant:#E7E0EC; --on-surface-variant:#49454F;
  --surface-container-lowest:#FFFFFF;
  --surface-container-low:#F7F2FA;
  --surface-container:#F3EDF7;
  --surface-container-high:#ECE6F0;
  --surface-container-highest:#E6E0E9;
  --outline:#79747E; --outline-variant:#CAC4D0;
  --inverse-surface:#322F35; --inverse-on-surface:#F5EFF7;
  --scrim:#000000;
  --success:#2E7D5B;
  --accent:#6750A4; --gold:#7D5260;
}

*{box-sizing:border-box;margin:0;padding:0}
*:focus{outline:none}

html,body{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  touch-action:manipulation;
  overscroll-behavior-y:none;
}
body{
  font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  background:var(--background);
  color:var(--on-background);
  min-height:100vh;
  transition:background var(--m3-dur-med) var(--m3-ease), color var(--m3-dur-med) var(--m3-ease);
  padding-bottom:160px;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{
  font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;
  -webkit-tap-highlight-color:transparent;position:relative;overflow:hidden;
}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* ================= Top App Bar ================= */
.site-header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(12px) saturate(180%);
  -webkit-backdrop-filter:blur(12px) saturate(180%);
  border-bottom:1px solid transparent;
  transition:background var(--m3-dur-med) var(--m3-ease), border-color var(--m3-dur-med) var(--m3-ease);
}
html[data-scrolled="true"] .site-header{
  border-bottom-color:var(--outline-variant);
  background:color-mix(in srgb, var(--surface-container) 96%, transparent);
}
.header-inner{
  max-width:1140px;margin:0 auto;padding:0.75rem 1rem;
  display:flex;align-items:center;gap:0.5rem;
}
.brand{
  display:flex;align-items:center;gap:0.75rem;
  font-weight:600;font-size:1.05rem;
  color:var(--on-surface);
}
.brand__mark{
  width:40px;height:40px;
  border-radius:var(--m3-md);
  background:var(--primary-container);
  color:var(--on-primary-container);
  display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;flex-shrink:0;
}
.header-spacer{flex:1}

.icon-btn{
  width:40px;height:40px;border-radius:var(--m3-full);
  display:flex;align-items:center;justify-content:center;
  color:var(--on-surface-variant);background:transparent;
  transition:background var(--m3-dur-short) var(--m3-ease), color var(--m3-dur-short) var(--m3-ease);
  font-size:1.05rem;
}
.icon-btn:hover{background:color-mix(in srgb, var(--on-surface-variant) 8%, transparent);}
.icon-btn:active{background:color-mix(in srgb, var(--on-surface-variant) 12%, transparent);}

.fav-header-btn.is-active{
  background:var(--tertiary-container);
  color:var(--on-tertiary-container);
}
.fav-count{
  position:absolute;top:-2px;inset-inline-start:-2px;
  min-width:18px;height:18px;padding:0 5px;
  border-radius:var(--m3-full);
  background:var(--error);color:var(--on-error);
  font-size:0.62rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--surface);
  transform:scale(0);
  transition:transform 250ms var(--m3-ease-emph);
  pointer-events:none;
}
.fav-count.is-visible{transform:scale(1)}
.fav-header-btn.is-active .fav-count{
  background:var(--on-tertiary-container);
  color:var(--tertiary-container);
  border-color:var(--tertiary-container);
}

/* ================= Container ================= */
.container{max-width:1140px;margin:0 auto;padding:1.25rem 1rem 0}

/* ================= Hero ================= */
.hero{
  background:linear-gradient(135deg,
    var(--primary-container) 0%,
    color-mix(in srgb, var(--primary-container) 65%, var(--surface-container)) 100%);
  color:var(--on-primary-container);
  border-radius:var(--m3-xl);
  padding:1.5rem;margin-bottom:1.5rem;
  display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;
  position:relative;overflow:hidden;
}
.hero__art{
  width:76px;height:76px;min-width:76px;
  border-radius:var(--m3-lg);
  background:color-mix(in srgb, var(--on-primary-container) 12%, transparent);
  color:var(--on-primary-container);
  display:flex;align-items:center;justify-content:center;
  font-size:1.85rem;position:relative;z-index:1;
  transition:box-shadow var(--m3-dur-long) var(--m3-ease);
}
.hero.is-playing .hero__art{
  box-shadow:0 0 0 6px color-mix(in srgb, var(--on-primary-container) 8%, transparent);
  animation:heroPulse 2.4s var(--m3-ease) infinite;
}
@keyframes heroPulse{
  0%,100%{box-shadow:0 0 0 6px color-mix(in srgb, var(--on-primary-container) 8%, transparent);}
  50%{box-shadow:0 0 0 12px color-mix(in srgb, var(--on-primary-container) 4%, transparent);}
}
.hero__info{flex:1;min-width:200px;position:relative;z-index:1}
.hero__label{
  font-size:0.75rem;font-weight:500;letter-spacing:0.5px;
  opacity:0.75;margin-bottom:0.35rem;text-transform:uppercase;
}
.hero__title{
  font-size:1.55rem;font-weight:700;line-height:1.2;
  margin-bottom:0.4rem;letter-spacing:-0.2px;
}
.hero__sub{
  font-size:0.88rem;opacity:0.85;
  display:flex;align-items:center;gap:0.45rem;flex-wrap:wrap;
}
.hero__sub i{font-size:0.8rem;opacity:0.9}

.hero__fav{
  position:relative;z-index:2;
  width:48px;height:48px;min-width:48px;
  border-radius:var(--m3-full);
  background:color-mix(in srgb, var(--on-primary-container) 10%, transparent);
  color:var(--on-primary-container);
  display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;
  transition:background var(--m3-dur-short) var(--m3-ease),
             color var(--m3-dur-short) var(--m3-ease),
             transform var(--m3-dur-short) var(--m3-ease-emph);
}
.hero__fav:hover{background:color-mix(in srgb, var(--on-primary-container) 16%, transparent);}
.hero__fav:active{transform:scale(0.94)}
.hero__fav.is-fav{
  background:var(--error);color:var(--on-error);
  animation:heartPop 450ms var(--m3-ease-emph);
}
@keyframes heartPop{
  0%{transform:scale(1)} 30%{transform:scale(1.22)}
  60%{transform:scale(0.96)} 100%{transform:scale(1)}
}

/* ================= Toolbar ================= */
.toolbar{
  display:grid;grid-template-columns:1fr 1fr;gap:0.85rem;margin-bottom:1.25rem;
}
@media (max-width:640px){.toolbar{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:0.4rem}
.field label{
  font-size:0.78rem;font-weight:600;
  color:var(--on-surface-variant);
  padding-inline-start:0.35rem;
}
.field select, .field input{
  width:100%;padding:0.85rem 1rem;
  border-radius:var(--m3-xs);
  background:transparent;
  border:1px solid var(--outline);
  color:var(--on-surface);
  font-family:inherit;font-size:0.92rem;font-weight:500;
  transition:border-color var(--m3-dur-short) var(--m3-ease), border-width var(--m3-dur-short) var(--m3-ease);
  -webkit-appearance:none;appearance:none;
}
.field select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23938F99' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;
  background-position:left 1rem center;
  padding-inline-start:2.5rem;
}
.field select:hover, .field input:hover{border-color:var(--on-surface)}
.field select:focus-visible, .field input:focus-visible{
  border-color:var(--primary);border-width:2px;
  padding:calc(0.85rem - 1px) calc(1rem - 1px);
}
.field input::placeholder{color:var(--on-surface-variant);opacity:0.7}

/* ================= Tabs (Segmented) ================= */
.tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:0;
  margin-bottom:1.5rem;padding:3px;
  background:var(--surface-container);
  border-radius:var(--m3-full);
  border:1px solid var(--outline-variant);
}
.tab-btn{
  display:flex;align-items:center;justify-content:center;gap:0.5rem;
  padding:0.7rem 1rem;
  border-radius:var(--m3-full);
  font-size:0.85rem;font-weight:600;
  color:var(--on-surface-variant);
  transition:background var(--m3-dur-short) var(--m3-ease), color var(--m3-dur-short) var(--m3-ease);
}
.tab-btn:hover:not(.is-active){
  background:color-mix(in srgb, var(--on-surface) 6%, transparent);
  color:var(--on-surface);
}
.tab-btn.is-active{
  background:var(--secondary-container);
  color:var(--on-secondary-container);
}
.tab-btn--fav.is-active{
  background:var(--error-container);
  color:var(--on-error-container);
}
.tab-btn .tab-count{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:20px;padding:0 7px;
  border-radius:var(--m3-full);
  background:color-mix(in srgb, currentColor 14%, transparent);
  font-size:0.68rem;font-weight:700;
}
.tab-btn.is-active .tab-count{
  background:color-mix(in srgb, currentColor 20%, transparent);
}

/* ================= Grid Head ================= */
.grid-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1rem;gap:1rem;flex-wrap:wrap;
  padding-inline:0.25rem;
}
.grid-head h2{
  font-size:1.05rem;font-weight:700;
  display:flex;align-items:center;gap:0.55rem;
  color:var(--on-surface);
}
.grid-head h2 i{color:var(--primary);font-size:1rem}
.grid-head .count{
  font-size:0.78rem;font-weight:500;
  color:var(--on-surface-variant);
}

/* ================= Clear favorites ================= */
.clear-favs{
  display:inline-flex;align-items:center;gap:0.45rem;
  padding:0.55rem 1rem;
  border-radius:var(--m3-full);
  background:transparent;
  color:var(--error);
  border:1px solid var(--outline-variant);
  font-size:0.8rem;font-weight:600;
  transition:background var(--m3-dur-short) var(--m3-ease), border-color var(--m3-dur-short) var(--m3-ease);
}
.clear-favs:hover{
  background:color-mix(in srgb, var(--error) 8%, transparent);
  border-color:var(--error);
}
.clear-favs:active{background:color-mix(in srgb, var(--error) 12%, transparent)}
.clear-favs:disabled{opacity:0.38;cursor:not-allowed}
.clear-favs.confirming{
  background:var(--error);color:var(--on-error);
  border-color:var(--error);
  animation:clearPulse 700ms var(--m3-ease) infinite alternate;
}
@keyframes clearPulse{from{opacity:0.9} to{opacity:1}}

/* ================= Surah Grid ================= */
.surah-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:0.75rem;
}
.surah-card{
  display:flex;align-items:center;
  background:var(--surface-container);
  border-radius:var(--m3-lg);
  overflow:hidden;position:relative;
  transition:background var(--m3-dur-med) var(--m3-ease),
             box-shadow var(--m3-dur-med) var(--m3-ease),
             transform var(--m3-dur-short) var(--m3-ease-emph);
}
.surah-card:hover{
  background:var(--surface-container-high);
  box-shadow:0 1px 3px color-mix(in srgb, var(--scrim) 18%, transparent);
}
.surah-card:active{transform:scale(0.99)}
.surah-card.is-active{
  background:var(--primary-container);
  color:var(--on-primary-container);
}
.surah-card.is-active .surah-card__num{
  background:var(--on-primary-container);
  color:var(--primary-container);
}
.surah-card.is-active .surah-card__type,
.surah-card.is-active .surah-card__play{
  color:var(--on-primary-container);
  opacity:0.75;
}
.surah-card.is-active .surah-card__play{opacity:1}
.surah-card.is-active .fav-btn{
  border-inline-start-color:color-mix(in srgb, var(--on-primary-container) 15%, transparent);
}

.surah-card__play-area{
  flex:1;display:flex;align-items:center;gap:0.75rem;
  padding:0.75rem 0.6rem 0.75rem 0.9rem;
  min-width:0;cursor:pointer;position:relative;
  transition:opacity var(--m3-dur-short) var(--m3-ease);
}
.surah-card__play-area:active{opacity:0.75}

.surah-card__num{
  width:36px;height:36px;min-width:36px;
  border-radius:var(--m3-md);
  display:flex;align-items:center;justify-content:center;
  background:var(--secondary-container);
  color:var(--on-secondary-container);
  font-size:0.78rem;font-weight:700;
  font-variant-numeric:tabular-nums;
  transition:background var(--m3-dur-short) var(--m3-ease), color var(--m3-dur-short) var(--m3-ease);
}
.surah-card__meta{flex:1;min-width:0;display:flex;flex-direction:column}
.surah-card__name{
  font-size:0.9rem;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.surah-card__type{
  font-size:0.72rem;color:var(--on-surface-variant);
  margin-top:0.15rem;font-weight:500;
}
.surah-card__play{
  color:var(--on-surface-variant);
  font-size:0.82rem;width:16px;text-align:center;
  transition:color var(--m3-dur-short) var(--m3-ease);
}
.surah-card:hover .surah-card__play{color:var(--primary)}

.fav-btn{
  width:52px;align-self:stretch;min-height:56px;
  display:flex;align-items:center;justify-content:center;
  color:var(--on-surface-variant);
  font-size:1.02rem;background:transparent;
  border-inline-start:1px solid var(--outline-variant);
  transition:background var(--m3-dur-short) var(--m3-ease), color var(--m3-dur-short) var(--m3-ease);
  position:relative;z-index:5;flex-shrink:0;
}
.fav-btn:hover{
  background:color-mix(in srgb, var(--error) 10%, transparent);
  color:var(--error);
}
.fav-btn:active{background:color-mix(in srgb, var(--error) 16%, transparent)}
.fav-btn.is-fav{
  color:var(--error);
  background:color-mix(in srgb, var(--error) 8%, transparent);
}
.fav-btn.is-fav i{animation:heartPop 400ms var(--m3-ease-emph)}

@media (max-width:400px){
  .fav-btn{width:46px;font-size:0.95rem}
  .surah-card__play-area{padding:0.7rem 0.5rem 0.7rem 0.75rem;gap:0.6rem}
}

.empty-note{
  grid-column:1/-1;text-align:center;padding:3rem 1rem;
  color:var(--on-surface-variant);
}
.empty-note i{font-size:2.4rem;display:block;margin-bottom:0.85rem;opacity:0.4}
.empty-note .empty-sub{font-size:0.82rem;opacity:0.7;margin-top:0.4rem}

/* ================= Player ================= */
.player{
  position:fixed;inset-inline:0;bottom:0;z-index:100;
  background:var(--surface-container-high);
  border-radius:var(--m3-xl) var(--m3-xl) 0 0;
  box-shadow:0 -4px 24px color-mix(in srgb, var(--scrim) 32%, transparent);
  transform:translateY(100%);
  transition:transform var(--m3-dur-long) var(--m3-ease-emph);
}
.player.is-visible{transform:translateY(0)}
.player__inner{max-width:1140px;margin:0 auto;padding:1rem 1.25rem 1.15rem}

.player__top{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.85rem}
.player__art{
  width:44px;height:44px;min-width:44px;
  border-radius:var(--m3-md);
  background:var(--primary-container);
  display:flex;align-items:center;justify-content:center;
  color:var(--on-primary-container);font-size:1.05rem;
  transition:box-shadow var(--m3-dur-med) var(--m3-ease);
}
.player.is-playing .player__art{
  box-shadow:0 0 0 5px color-mix(in srgb, var(--primary) 12%, transparent);
}
.player__info{flex:1;min-width:0}
.player__title{
  font-size:0.92rem;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.player__sub{
  font-size:0.74rem;color:var(--on-surface-variant);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:0.15rem;
}
.player__fav{
  width:42px;height:42px;min-width:42px;
  border-radius:var(--m3-full);
  display:flex;align-items:center;justify-content:center;
  color:var(--on-surface-variant);font-size:1rem;
  transition:background var(--m3-dur-short) var(--m3-ease), color var(--m3-dur-short) var(--m3-ease);
}
.player__fav:hover{
  background:color-mix(in srgb, var(--error) 10%, transparent);
  color:var(--error);
}
.player__fav.is-fav{
  color:var(--error);
  background:color-mix(in srgb, var(--error) 10%, transparent);
}
.player__fav.is-fav i{animation:heartPop 400ms var(--m3-ease-emph)}

.player__controls{display:flex;align-items:center;gap:0.25rem}
.pbtn{
  width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--m3-full);
  color:var(--on-surface-variant);font-size:0.95rem;
  transition:background var(--m3-dur-short) var(--m3-ease),
             color var(--m3-dur-short) var(--m3-ease),
             transform var(--m3-dur-short) var(--m3-ease-emph);
  position:relative;
}
.pbtn:hover{
  background:color-mix(in srgb, var(--on-surface) 8%, transparent);
  color:var(--on-surface);
}
.pbtn:active{transform:scale(0.92)}

.pbtn--main{
  width:56px;height:56px;
  background:var(--primary);color:var(--on-primary);
  font-size:1.2rem;
  box-shadow:0 1px 3px color-mix(in srgb, var(--scrim) 30%, transparent),
             0 1px 2px color-mix(in srgb, var(--scrim) 15%, transparent);
  transition:background var(--m3-dur-short) var(--m3-ease),
             box-shadow var(--m3-dur-short) var(--m3-ease),
             transform var(--m3-dur-short) var(--m3-ease-emph);
}
.pbtn--main:hover{
  background:color-mix(in srgb, var(--primary) 92%, var(--on-primary) 8%);

}
.pbtn--main:active{transform:scale(0.95)}
.pbtn:disabled{opacity:0.38;cursor:not-allowed}

.pbtn--main > i{position:relative;z-index:2;transition:opacity var(--m3-dur-short)}

html[dir="rtl"] #prevBtn i,
html[dir="rtl"] #nextBtn i{display:inline-block;transform:scaleX(-1)}

.loader-ring{
  position:absolute;inset:6px;width:auto;height:auto;

}
.pbtn--main.is-loading{background:var(--primary)}

.loader-track{

}
.loader-arc{

}
@keyframes loaderRotate{to{transform:rotate(360deg)}}
@keyframes loaderDash{
  0%{stroke-dasharray:1,200;stroke-dashoffset:0}

}

<script>
/* ================= منع التكبير ================= */
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && ['+','-','=','0'].includes(e.key)) e.preventDefault();
});
(function(){
  const mv = document.querySelector('meta[name="viewport"]');
  if (mv) mv.setAttribute('content',
    'width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover');
})();

/* ================= Ripple ================= */
function attachRipple(el){
  el.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const r = document.createElement('span');
    r.className = 'md-ripple';
    r.style.cssText = `position:absolute;width:${size}px;height:${size}px;border-radius:50%;
      transform:scale(0);background:currentColor;opacity:0.25;pointer-events:none;
      left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px;
      animation:mdRipple 600ms cubic-bezier(0.05,0.7,0.1,1) forwards`;
    el.appendChild(r);
    setTimeout(() => r.remove(), 650);
  });
}
(function(){
  const style = document.createElement('style');
  style.textContent = '@keyframes mdRipple{to{transform:scale(2.4);opacity:0}}';
  document.head.appendChild(style);
})();

/* ================= البيانات ================= */
const RECITERS = [
  { id:'lhdan',   name:'محمد اللحيدان',        base:'https://server8.mp3quran.net/lhdan/' },
  { id:'husary',  name:'محمود خليل الحصري',    base:'https://server13.mp3quran.net/husr/' },
  { id:'minsh',   name:'محمد صديق المنشاوي',   base:'https://download.tvquran.com/download/TvQuran.com__Al-Minshawi-Mojawad/' },
  { id:'abdulb',  name:'عبد الباسط عبد الصمد', base:'https://server7.mp3quran.net/basit/' },
  { id:'shatri',  name:'أبو بكر الشاطري',      base:'https://server11.mp3quran.net/shatri/' },
  { id:'ghamdi',  name:'سعد الغامدي',          base:'https://server7.mp3quran.net/s_gmd/' },
  { id:'ajamy',   name:'أحمد بن علي العجمي',   base:'https://server10.mp3quran.net/ajm/' },
  { id:'juhany',  name:'عبد الله الجهني',      base:'https://server13.mp3quran.net/jhn/' },
  { id:'maher',   name:'ماهر المعيقلي',        base:'https://server12.mp3quran.net/maher/' },
  { id:'sudais',  name:'عبد الرحمن السديس',    base:'https://server11.mp3quran.net/sds/' },
  { id:'yasser',  name:'ياسر الدوسري',          base:'https://server11.mp3quran.net/yasser/' },
  { id:'shuraim', name:'سعود الشريم',           base:'https://server7.mp3quran.net/shur/' },
  { id:'budair',  name:'صلاح البدير',           base:'https://server6.mp3quran.net/s_bud/' },
  { id:'qasim',   name:'عبد المحسن القاسم',     base:'https://server8.mp3quran.net/qasm/' },
  { id:'fares',   name:'فارس عباد',             base:'https://server8.mp3quran.net/frs_a/' },
  { id:'jleel',   name:'خالد الجليل',           base:'https://server10.mp3quran.net/jleel/' },
  { id:'ayyub',   name:'محمد أيوب',             base:'https://server8.mp3quran.net/ayyub/' },
  { id:'tblawi',  name:'محمد الطبلاوي',         base:'https://server12.mp3quran.net/tblawi/' },
  { id:'hani',    name:'هاني الرفاعي',          base:'https://server8.mp3quran.net/hani/' },
  { id:'a_jbr',   name:'علي جابر',              base:'https://server11.mp3quran.net/a_jbr/' },
  { id:'bna',     name:'محمود علي البنا',       base:'https://server8.mp3quran.net/bna/' }
];

const SURAH_NAMES = [
  "الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس",
  "هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه",
  "الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم",
  "لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر",
  "فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق",
  "الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة",
  "الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج",
  "نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس",
  "التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد",
  "الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات",
  "القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر",
  "المسد","الإخلاص","الفلق","الناس"
];

const MADANI = new Set([2,3,4,5,9,13,22,24,33,47,48,49,55,57,58,59,60,61,62,63,64,65,66,76,98,99,110]);
const SURAHS = SURAH_NAMES.map((name, i) => ({
  number: i + 1,
  name,
  type: MADANI.has(i + 1) ? 'مدنية' : 'مكية'
}));

/* ================= الحالة ================= */
const FAV_KEY = 'quran-favorites-v1';
const state = {
  reciterIndex: 0,
  currentSurah: 11,
  playing: false,
  loading: false,
  filtered: null,
  view: 'all',
  favorites: new Set()
};
let loadId = 0;
let confirmState = null;
let confirmTimer = null;

/* ================= أدوات ================= */
const $ = id => document.getElementById(id);
const pad3 = n => String(n).padStart(3, '0');
const surahUrl = (n, i = state.reciterIndex) => RECITERS[i].base + pad3(n) + '.mp3';

function fmtTime(sec){
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}
function setRangeProgress(el, pct){
  el.style.setProperty('--progress', Math.max(0, Math.min(100, pct)) + '%');
}

let toastTimer;
function showToast(msg, type){
  const t = $('toast'), txt = $('toastText'), ic = t.querySelector('i');
  txt.textContent = msg;
  if (type === 'add' || type === 'remove') ic.className = 'fa-solid fa-heart heart';
  else if (type === 'warn') ic.className = 'fa-solid fa-triangle-exclamation warn';
  else ic.className = 'fa-solid fa-circle-check';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ================= المفضلة ================= */
function loadFavorites(){
  try{
    const raw = localStorage.getItem(FAV_KEY);
    if (!raw) return;
    const arr = JSON.parse(raw);
    if (Array.isArray(arr)) arr.forEach(n => {
      const num = Number(n);
      if (Number.isInteger(num) && num >= 1 && num <= 114) state.favorites.add(num);
    });
  }catch(e){}
}
function saveFavorites(){
  try{ localStorage.setItem(FAV_KEY, JSON.stringify([...state.favorites])); }catch(e){}
}
const isFav = n => state.favorites.has(n);

function toggleFavorite(n, { silent = false } = {}){
  const surah = SURAHS[n - 1];
  if (!surah) return;
  if (state.favorites.has(n)){
    state.favorites.delete(n);
    if (!silent) showToast('أُزيلت سورة ' + surah.name + ' من المفضلة', 'remove');
  } else {
    state.favorites.add(n);
    if (!silent) showToast('أُضيفت سورة ' + surah.name + ' إلى المفضلة', 'add');
  }
  saveFavorites();
  updateFavUI();
  if (state.view === 'fav') buildSurahGrid();
  else updateCardFavButton(n);
}

function updateCardFavButton(n){
  const btn = $('surahGrid').querySelector('.fav-btn[data-fav="' + n + '"]');
  if (!btn) return;
  const favNow = isFav(n);
  btn.classList.toggle('is-fav', favNow);
  btn.title = favNow ? 'إزالة من المفضلة' : 'إضافة إلى المفضلة';
  btn.setAttribute('aria-label', btn.title);
  const ic = btn.querySelector('i');
  if (ic) ic.className = (favNow ? 'fa-solid' : 'fa-regular') + ' fa-heart';
}

function updateFavUI(){
  const count = state.favorites.size;

  const fh = $('favHeaderBtn');
  const fc = $('favHeaderCount');
  fh.classList.toggle('is-active', count > 0);
  fc.textContent = count > 99 ? '99+' : count;
  fc.classList.toggle('is-visible', count > 0);

  $('tabFavCount').textContent = count;

  const heroFavBtn = $('heroFavBtn');
  const heroIcon = heroFavBtn.querySelector('i');
  const curFav = isFav(state.currentSurah);
  heroFavBtn.classList.toggle('is-fav', curFav);
  heroIcon.className = curFav ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
  heroFavBtn.title = curFav ? 'إزالة من المفضلة' : 'إضافة إلى المفضلة';

  const pf = $('playerFavBtn');
  if (pf){
    const pfi = pf.querySelector('i');
    pf.classList.toggle('is-fav', curFav);
    pfi.className = curFav ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
    pf.title = heroFavBtn.title;
  }

  const clearBtn = $('clearFavsBtn');
  if (clearBtn){
    const showClear = (state.view === 'fav') && count > 0;
    clearBtn.style.display = showClear ? 'inline-flex' : 'none';
    clearBtn.disabled = !showClear;
  }
}

function doClearAllFavorites(){
  const btn = $('clearFavsBtn');
  const txt = $('clearFavsText');
  if (confirmState === 'clear'){
    clearTimeout(confirmTimer);
    confirmState = null;
    btn.classList.remove('confirming');
    txt.textContent = 'مسح المفضلة';
    state.favorites.clear();
    saveFavorites();
    showToast('تمت إزالة جميع السور من المفضلة', 'remove');
    buildSurahGrid();
    updateFavUI();
    return;
  }
  confirmState = 'clear';
  btn.classList.add('confirming');
  txt.textContent = 'اضغط للتأكيد';
  showToast('اضغط الزر مرة أخرى للتأكيد', 'warn');
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(() => {
    confirmState = null;
    btn.classList.remove('confirming');
    txt.textContent = 'مسح المفضلة';
  }, 3000);
}

/* ================= التحميل ================= */
function setLoading(on){
  if (state.loading === on) return;
  state.loading = on;
  $('playBtn').classList.toggle('is-loading', on);
  refreshActiveCards();
}

/* ================= القرّاء ================= */
function buildReciters(){
  const sel = $('reciterSelect');
  sel.innerHTML = '';
  RECITERS.forEach((r, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = r.name;
    sel.appendChild(o);
  });
  sel.value = state.reciterIndex;
}

/* ================= السور الظاهرة ================= */
function getVisibleSurahs(){
  if (state.view === 'fav'){
    return SURAHS.filter(s => state.favorites.has(s.number))
      .filter(s => !state.filtered || state.filtered.some(f => f.number === s.number));
  }
  return state.filtered || SURAHS;
}

/* ================= بناء الشبكة ================= */
function buildSurahGrid(){
  const grid = $('surahGrid');
  const list = getVisibleSurahs();
  grid.innerHTML = '';

  if (!list.length){
    grid.innerHTML = state.view === 'fav'
      ? `<div class="empty-note"><i class="fa-regular fa-heart"></i>لا توجد سور في المفضلة بعد<div class="empty-sub">اضغط على أيقونة القلب في أي سورة لإضافتها</div></div>`
      : `<div class="empty-note"><i class="fa-solid fa-magnifying-glass"></i>لا توجد نتائج مطابقة للبحث</div>`;
    $('countLabel').textContent = '';
    updateFavUI();
    return;
  }

  const frag = document.createDocumentFragment();
  list.forEach(s => {
    const isFavNow = isFav(s.number);
    const card = document.createElement('div');
    card.className = 'surah-card' + (s.number === state.currentSurah ? ' is-active' : '');
    card.dataset.number = s.number;

    const playArea = document.createElement('div');
    playArea.className = 'surah-card__play-area';
    playArea.setAttribute('role', 'button');
    playArea.setAttribute('tabindex', '0');
    playArea.setAttribute('aria-label', 'تشغيل سورة ' + s.name);
    playArea.dataset.play = s.number;
    playArea.innerHTML = `
      <span class="surah-card__num">${s.number}</span>
      <span class="surah-card__meta">
        <span class="surah-card__name">سورة ${s.name}</span>
        <span class="surah-card__type">${s.type}</span>
      </span>
      <span class="surah-card__play"><i class="fa-solid fa-play"></i></span>`;

    const favBtn = document.createElement('button');
    favBtn.type = 'button';
    favBtn.className = 'fav-btn' + (isFavNow ? ' is-fav' : '');
    favBtn.dataset.fav = s.number;
    favBtn.title = isFavNow ? 'إزالة من المفضلة' : 'إضافة إلى المفضلة';
    favBtn.setAttribute('aria-label', favBtn.title);
    favBtn.innerHTML = `<i class="${isFavNow ? 'fa-solid' : 'fa-regular'} fa-heart"></i>`;

    card.appendChild(playArea);
    card.appendChild(favBtn);
    frag.appendChild(card);
  });
  grid.appendChild(frag);
  $('countLabel').textContent = list.length + ' سورة';
  refreshActiveCards();
  updateFavUI();
}

function refreshActiveCards(){
  $('surahGrid').querySelectorAll('.surah-card').forEach(card => {
    const isActive = Number(card.dataset.number) === state.currentSurah;
    card.classList.toggle('is-active', isActive);
    const ic = card.querySelector('.surah-card__play i');
    if (!ic) return;
    if (isActive && state.loading) ic.className = 'fa-solid fa-spinner fa-spin';
    else if (isActive && state.playing) ic.className = 'fa-solid fa-volume-high';
    else ic.className = 'fa-solid fa-play';
  });
}

/* ================= تشغيل سورة ================= */
function playSurah(number, { autoplay = true } = {}){
  const myId = ++loadId;
  state.currentSurah = number;
  const surah = SURAHS[number - 1];
  const reciter = RECITERS[state.reciterIndex];

  $('heroTitle').textContent = 'سورة ' + surah.name;
  $('heroReciter').textContent = reciter.name;
  $('pTitle').textContent = 'سورة ' + surah.name;
  $('pSub').textContent = reciter.name + ' • ' + surah.type;

  setRangeProgress($('seekRange'), 0);
  $('seekRange').value = 0;
  $('curTime').textContent = '0:00';
  $('durTime').textContent = '0:00';

  $('audio').src = surahUrl(number);
  $('player').classList.add('is-visible');
  refreshActiveCards();
  updateFavUI();

  if (autoplay){
    setLoading(true);
    const p = $('audio').play();
    if (p && p.catch) p.catch(() => {
      if (myId !== loadId) return;
      setLoading(false);
      state.playing = false;
      updatePlayIcon();
    });
  }
}

function updatePlayIcon(){
  const btn = $('playBtn');
  const ic = btn.querySelector('.play-icon');
  ic.className = 'play-icon fa-solid ' + (state.playing ? 'fa-pause' : 'fa-play');
  btn.classList.toggle('is-loading', state.loading);
  btn.setAttribute('aria-label', state.loading ? 'جارٍ التحميل' : (state.playing ? 'إيقاف' : 'تشغيل'));
  $('player').classList.toggle('is-playing', state.playing);
  $('hero').classList.toggle('is-playing', state.playing);
  refreshActiveCards();
}

/* ================= أحداث المفضلة ================= */
function setupFavoriteEvents(){
  $('heroFavBtn').addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    toggleFavorite(state.currentSurah);
  });
  $('playerFavBtn').addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    toggleFavorite(state.currentSurah);
  });
  $('favHeaderBtn').addEventListener('click', e => {
    e.preventDefault();
    setView('fav');
    const tabs = document.querySelector('.tabs');
    if (tabs) tabs.scrollIntoView({ behavior:'smooth', block:'start' });
  });
  $('clearFavsBtn').addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    doClearAllFavorites();
  });
  $('surahGrid').addEventListener('click', e => {
    const favBtn = e.target.closest('.fav-btn');
    if (favBtn){
      e.preventDefault(); e.stopPropagation();
      toggleFavorite(Number(favBtn.dataset.fav));
      return;
    }
    const playArea = e.target.closest('.surah-card__play-area');
    if (playArea){
      e.preventDefault();
      playSurah(Number(playArea.dataset.play));
    }
  });
  $('surahGrid').addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const playArea = e.target.closest('.surah-card__play-area');
    if (!playArea) return;
    e.preventDefault();
    playSurah(Number(playArea.dataset.play));
  });
}

/* ================= التبويبات ================= */
function setView(view){
  state.view = view;
  $('tabAll').classList.toggle('is-active', view === 'all');
  $('tabAll').setAttribute('aria-selected', view === 'all');
  $('tabFav').classList.toggle('is-active', view === 'fav');
  $('tabFav').setAttribute('aria-selected', view === 'fav');

  const heading = $('gridHeading');
  if (view === 'fav') heading.innerHTML = '<i class="fa-solid fa-heart" style="color:var(--error)"></i> السور المفضلة';
  else heading.innerHTML = '<i class="fa-solid fa-list-ul"></i> قائمة السور';

  confirmState = null;
  clearTimeout(confirmTimer);
  const btn = $('clearFavsBtn');
  btn.classList.remove('confirming');
  $('clearFavsText').textContent = 'مسح المفضلة';
  if (view !== 'fav') btn.style.display = 'none';

  buildSurahGrid();
}

/* ================= المشغل ================= */
const audio = $('audio');

$('playBtn').addEventListener('click', () => {
  if (!audio.src){ playSurah(state.currentSurah); return; }
  if (audio.paused){
    setLoading(true);
    const p = audio.play();
    if (p && p.catch) p.catch(() => setLoading(false));
  } else audio.pause();
});

$('prevBtn').addEventListener('click', () => {
  let n = state.currentSurah - 1; if (n < 1) n = 114;
  playSurah(n);
});
$('nextBtn').addEventListener('click', () => {
  let n = state.currentSurah + 1; if (n > 114) n = 1;
  playSurah(n);
});

let isSeeking = false;
const seekRange = $('seekRange');
seekRange.addEventListener('input', () => {
  isSeeking = true;
  const pct = Number(seekRange.value);
  setRangeProgress(seekRange, pct);
  if (audio.duration) $('curTime').textContent = fmtTime((pct / 100) * audio.duration);
});
seekRange.addEventListener('change', () => {
  if (audio.duration) audio.currentTime = (Number(seekRange.value) / 100) * audio.duration;
  isSeeking = false;
});

const volumeRange = $('volumeRange');
const volIcon = $('volIcon');
function updateVolumeUI(){
  const v = Number(volumeRange.value);
  setRangeProgress(volumeRange, v * 100);
  audio.volume = v;
  audio.muted = v === 0;
  volIcon.className = v === 0
    ? 'fa-solid fa-volume-xmark vol-icon'
    : (v < 0.5 ? 'fa-solid fa-volume-low vol-icon' : 'fa-solid fa-volume-high vol-icon');
}
volumeRange.addEventListener('input', updateVolumeUI);
volIcon.addEventListener('click', () => {
  if (audio.volume > 0){ volIcon.dataset.lastVol = audio.volume; volumeRange.value = 0; }
  else volumeRange.value = volIcon.dataset.lastVol || 1;
  updateVolumeUI();
});

let pauseDebounce;
audio.addEventListener('play', () => {
  clearTimeout(pauseDebounce);
  state.playing = true; updatePlayIcon();
});
audio.addEventListener('playing', () => {
  clearTimeout(pauseDebounce);
  setLoading(false); state.playing = true; updatePlayIcon();
});
audio.addEventListener('pause', () => {
  clearTimeout(pauseDebounce);
  pauseDebounce = setTimeout(() => {
    if (!audio.paused) return;
    state.playing = false; setLoading(false); updatePlayIcon();
  }, 120);
});
audio.addEventListener('waiting', () => setLoading(true));
audio.addEventListener('stalled', () => setLoading(true));
audio.addEventListener('canplay', () => { if (!audio.paused) setLoading(false); });
audio.addEventListener('ended', () => {
  state.playing = false; setLoading(false); updatePlayIcon();
  let n = state.currentSurah + 1;
  if (n > 114){ showToast('انتهى المصحف — تم التوقف'); return; }
  playSurah(n);
});
audio.addEventListener('loadedmetadata', () => {
  $('durTime').textContent = fmtTime(audio.duration);
});
audio.addEventListener('timeupdate', () => {
  if (!audio.duration || isSeeking) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  seekRange.value = pct;
  setRangeProgress(seekRange, pct);
  $('curTime').textContent = fmtTime(audio.currentTime);
});
audio.addEventListener('error', () => {
  if (!audio.src) return;
  setLoading(false);
  showToast('تعذّر تحميل التلاوة — جرّب قارئاً آخر', 'warn');
  state.playing = false;
  updatePlayIcon();
});

$('reciterSelect').addEventListener('change', () => {
  state.reciterIndex = Number($('reciterSelect').value);
  const wasPlaying = !audio.paused;
  playSurah(state.currentSurah, { autoplay: wasPlaying });
  showToast('القارئ: ' + RECITERS[state.reciterIndex].name);
});

$('searchInput').addEventListener('input', () => {
  const q = $('searchInput').value.trim();
  if (!q) state.filtered = null;
  else state.filtered = SURAHS.filter(s =>
    s.name.includes(q) ||
    String(s.number) === q ||
    String(s.number).padStart(3, '0') === q
  );
  buildSurahGrid();
});

/* ================= المظهر ================= */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('quran-theme', theme); } catch(e){}
  $('themeBtn').innerHTML = theme === 'dark'
    ? '<i class="fa-solid fa-moon"></i>'
    : '<i class="fa-solid fa-sun"></i>';
}
$('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});

/* ================= شريط التمرير للهيدر ================= */
window.addEventListener('scroll', () => {
  document.documentElement.setAttribute('data-scrolled', window.scrollY > 4 ? 'true' : 'false');
}, { passive: true });

/* ================= اختصارات ================= */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space'){ e.preventDefault(); $('playBtn').click(); }
  else if (e.code === 'ArrowRight') $('prevBtn').click();
  else if (e.code === 'ArrowLeft') $('nextBtn').click();
});

/* ================= Ripple على الأزرار ================= */
document.querySelectorAll('.icon-btn, .tab-btn, .pbtn, .hero__fav, .player__fav, .fav-btn, .clear-favs')
  .forEach(attachRipple);

/* ================= التهيئة ================= */
(function init(){
  let saved = 'dark';
  try { saved = localStorage.getItem('quran-theme') || 'dark'; } catch(e){}
  applyTheme(saved);

  loadFavorites();
  buildReciters();

  $('tabAll').addEventListener('click', () => setView('all'));
  $('tabFav').addEventListener('click', () => setView('fav'));

  setupFavoriteEvents();
  setView('all');

  volumeRange.value = 1;
  updateVolumeUI();

  playSurah(state.currentSurah, { autoplay: false });
  updateFavUI();

  $('tabAllCount').textContent = SURAHS.length;
})();
</script>

</body>
</html>
